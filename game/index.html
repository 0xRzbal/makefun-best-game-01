<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23ffcf6a%22/><circle cx=%2216%22 cy=%2216%22 r=%228%22 fill=%22%23fffbe8%22/></svg>">
<title>Heliopause — a gravity-mining arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04040a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Heliopause: steer your pulse-runner around a living star, shoot the drifting rockfield and harvest plasma cores. Rotate with arrows or A/D, thrust with up/W, aim and fire with the mouse or Space. Fill the warp meter to ride into deeper orbits."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
